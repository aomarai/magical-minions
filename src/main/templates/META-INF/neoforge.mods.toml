modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/aomarai/magical-minions/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/aomarai/magical-minions"
description='''
Conjure and customize your own minions: rune golems, ember imps, bonebound acolytes, starlight wisps and mosslings.
Mix parts across lineages at the Conjurer's Bench, bond with them, and bring them on your adventures.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    reason="Renders and animates minions."
    versionRange="[${geckolib_version},)"
    ordering="AFTER"
    side="BOTH"
